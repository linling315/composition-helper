<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>构图辅助拍照</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,sans-serif}
  #video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  #overlay img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;
    transform-origin:center center;will-change:transform;transition:none}
  .touch-layer{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
  .top-bar{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;
    justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top);z-index:10}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
    border:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
  .bottom-bar{position:absolute;left:0;right:0;bottom:0;padding:20px 24px 30px;padding-bottom:calc(30px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:14px;z-index:10;
    background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
  .opacity-row{display:flex;align-items:center;gap:10px;width:100%;color:#fff}
  .opacity-row input[type=range]{flex:1;accent-color:#fff}
  .shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #ccc;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .shutter:active{transform:scale(.95)}
  .shutter.saving{background:#ddd}
  #start-screen{position:absolute;inset:0;background:#111;color:#fff;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
  #start-screen button{padding:14px 28px;border-radius:10px;border:none;background:#2b8cff;
    color:#fff;font-size:17px;cursor:pointer}
  #start-screen button:active{opacity:.8}
  .hint{font-size:13px;color:#888;line-height:1.6}
  #file-input{display:none}
  .toast{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);
    background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="start-screen">
  <h2>构图辅助拍照</h2>
  <p class="hint">先选一张示例照片，<br>然后按它的构图去拍。</p >
  <button id="pick-btn">选择示例照片</button>
  <p class="hint">需要允许相机权限<br>建议用 Chrome / Safari 打开</p >
</div>

<input type="file" id="file-input" accept="image/*">

<video id="video" playsinline autoplay muted></video>
<div id="overlay">< img id="overlay-img" alt=""></div>
<div class="touch-layer" id="touch-layer"></div>

<div class="top-bar">
  <button class="icon-btn" id="back-btn">←</button>
  <button class="icon-btn" id="switch-btn">⟳</button>
</div>

<div class="bottom-bar">
  <div class="opacity-row">
    <span>透明度</span>
    <input type="range" id="opacity" min="5" max="100" value="50">
  </div>
  <div class="shutter" id="shutter"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const video = document.getElementById('video');
const overlayImg = document.getElementById('overlay-img');
const touchLayer = document.getElementById('touch-layer');
const opacitySlider = document.getElementById('opacity');
const shutter = document.getElementById('shutter');
const startScreen = document.getElementById('start-screen');
const fileInput = document.getElementById('file-input');
const toast = document.getElementById('toast');

let stream = null;
let facingMode = 'environment';
let transform = { x: 0, y: 0, scale: 1 };
let gesture = null;

function showToast(msg, ms=1800) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), ms);
}

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    // 前置默认镜像
    video.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'none';
  } catch (e) {
    showToast('相机启动失败: ' + e.message, 3000);
  }
}

function applyTransform() {
  overlayImg.style.transform =
    `translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`;
}

// 选择示例照片
document.getElementById('pick-btn').addEventListener('click', () => {
  fileInput.click();
});
