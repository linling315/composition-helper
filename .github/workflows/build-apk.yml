name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter project structure
        run: |
          mkdir -p /tmp/lib_backup
          cp -r lib/* /tmp/lib_backup/ 2>/dev/null || true
          flutter create --org com.example --project-name composition_helper --platforms=android .
          cp -r /tmp/lib_backup/* lib/

      - name: Add dependencies
        run: |
          cat >> pubspec.yaml << 'EOF'

          dependencies:
            camera: ^0.11.0
            image_picker: ^1.1.2
            image_gallery_saver: ^2.0.3
            path_provider: ^2.1.4
            permission_handler: ^11.3.0
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n<application/' $MANIFEST

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: composition-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
